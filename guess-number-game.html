<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Угадай число</title>
<style>
  :root{
    --bg:#0f1117;
    --card:#181b24;
    --card2:#20242f;
    --border:#2a2f3d;
    --accent:#6c5ce7;
    --accent-hover:#7d6ef0;
    --text:#eceef3;
    --text-muted:#8b90a0;
    --success:#2ecc71;
    --danger:#ff5d5d;
    --warning:#ffb84d;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 20% 20%, #1b1e2b 0%, var(--bg) 60%);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:440px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 4px;
    text-align:center;
  }
  .subtitle{
    color:var(--text-muted);
    font-size:14px;
    text-align:center;
    margin:0 0 24px;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  input[type="text"], input[type="password"]{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    font-size:15px;
    outline:none;
    margin-bottom:16px;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--accent);}
  button{
    cursor:pointer;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    padding:12px 16px;
    transition:background .15s, opacity .15s, transform .05s;
  }
  button:active{transform:scale(0.98);}
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-ghost{
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--border);
    width:100%;
    margin-top:10px;
  }
  .btn-ghost:hover{color:var(--text); border-color:var(--accent);}
  .switch-row{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:var(--text-muted);
  }
  .switch-row a{
    color:var(--accent);
    cursor:pointer;
    text-decoration:none;
    font-weight:600;
  }
  .error-msg{
    background:rgba(255,93,93,0.12);
    color:var(--danger);
    border:1px solid rgba(255,93,93,0.3);
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:16px;
    display:none;
  }
  .success-msg{
    background:rgba(46,204,113,0.12);
    color:var(--success);
    border:1px solid rgba(46,204,113,0.3);
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:16px;
    display:none;
  }

  /* Main app layout */
  .main-wrap{display:none; width:100%; max-width:480px;}
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    padding:0 4px;
  }
  .topbar .who{font-size:14px; color:var(--text-muted);}
  .topbar .who b{color:var(--text);}
  .logout-btn{
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:7px 12px;
    font-size:13px;
    font-weight:500;
  }
  .logout-btn:hover{color:var(--danger); border-color:var(--danger);}

  .tabs{
    display:flex;
    background:var(--card2);
    border-radius:12px;
    padding:4px;
    margin-bottom:18px;
    border:1px solid var(--border);
  }
  .tab-btn{
    flex:1;
    background:transparent;
    color:var(--text-muted);
    padding:10px 8px;
    font-size:13px;
    font-weight:600;
    border-radius:9px;
  }
  .tab-btn.active{
    background:var(--accent);
    color:#fff;
  }

  .tab-content{display:none;}
  .tab-content.active{display:block;}

  /* Game */
  .game-number{
    text-align:center;
    font-size:56px;
    font-weight:700;
    margin:8px 0 4px;
    color:var(--accent);
    min-height:66px;
  }
  .attempts-left{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    margin-bottom:20px;
  }
  .guess-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .guess-row input{margin-bottom:0; text-align:center; font-size:18px;}
  .guess-row button{flex-shrink:0; padding:12px 20px;}
  .feedback{
    text-align:center;
    font-size:15px;
    font-weight:600;
    min-height:22px;
    margin-bottom:10px;
  }
  .feedback.hint-up{color:var(--warning);}
  .feedback.hint-down{color:var(--warning);}
  .feedback.win{color:var(--success);}
  .feedback.lose{color:var(--danger);}
  .history{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:6px;
    min-height:30px;
  }
  .history span{
    width:32px;
    height:32px;
    border-radius:8px;
    background:var(--card2);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:600;
  }
  .score-line{
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }
  .score-line b{color:var(--text); font-size:18px;}

  /* Leaderboard */
  .lb-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 10px;
    border-bottom:1px solid var(--border);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{
    width:26px;
    font-weight:700;
    color:var(--text-muted);
    font-size:14px;
    text-align:center;
  }
  .lb-rank.gold{color:#ffd700;}
  .lb-rank.silver{color:#c0c0c0;}
  .lb-rank.bronze{color:#cd7f32;}
  .lb-name{flex:1; font-size:14px; font-weight:500;}
  .lb-name.me{color:var(--accent);}
  .lb-score{font-weight:700; font-size:14px;}
  .empty-note{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:24px 0;
  }
  .loading-note{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:16px 0;
  }
  .section-title{
    font-size:14px;
    font-weight:600;
    color:var(--text-muted);
    margin:0 0 14px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
</style>
</head>
<body>

<div class="app" id="authScreen">
  <div class="card">
    <h1>Угадай число</h1>
    <p class="subtitle" id="authSubtitle">Войдите в аккаунт, чтобы начать игру</p>
    <div class="error-msg" id="authError"></div>
    <div class="success-msg" id="authSuccess"></div>

    <label for="loginInput">Логин</label>
    <input type="text" id="loginInput" placeholder="Ваш логин" autocomplete="username">

    <label for="passInput">Пароль</label>
    <input type="password" id="passInput" placeholder="Ваш пароль" autocomplete="current-password">

    <button class="btn-primary" id="authMainBtn">Войти</button>
    <button class="btn-ghost" id="authSwitchBtn">Создать новый аккаунт</button>
  </div>
</div>

<div class="main-wrap" id="mainScreen">
  <div class="topbar">
    <div class="who">Привет, <b id="whoName"></b></div>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="game">Игра</button>
    <button class="tab-btn" data-tab="leaderboard">Лидеры</button>
    <button class="tab-btn" data-tab="profile">Профиль</button>
  </div>

  <div class="card tab-content active" id="tab-game">
    <p class="subtitle" style="margin-bottom:16px;">Загадано число от 1 до 10. У тебя 3 попытки.</p>
    <div class="game-number" id="gameLastGuess">—</div>
    <div class="attempts-left" id="attemptsLeft">Осталось попыток: 3</div>

    <div class="history" id="guessHistory"></div>

    <div class="feedback" id="gameFeedback"></div>

    <div class="guess-row">
      <input type="text" inputmode="numeric" id="guessInput" placeholder="Число от 1 до 10" maxlength="2">
      <button class="btn-primary" id="guessBtn" style="width:auto;">Угадать</button>
    </div>
    <button class="btn-ghost" id="newGameBtn" style="display:none;">Новая игра</button>

    <div class="score-line">Твой счёт: <b id="myScore">0</b></div>
  </div>

  <div class="card tab-content" id="tab-leaderboard">
    <p class="section-title">Таблица лидеров</p>
    <div id="leaderboardList"><div class="loading-note">Загрузка…</div></div>
  </div>

  <div class="card tab-content" id="tab-profile">
    <p class="section-title">Изменить логин</p>
    <div class="error-msg" id="profileLoginError"></div>
    <div class="success-msg" id="profileLoginSuccess"></div>
    <label for="newLoginInput">Новый логин</label>
    <input type="text" id="newLoginInput" placeholder="Новый логин">
    <button class="btn-primary" id="changeLoginBtn">Сохранить логин</button>

    <p class="section-title" style="margin-top:28px;">Изменить пароль</p>
    <div class="error-msg" id="profilePassError"></div>
    <div class="success-msg" id="profilePassSuccess"></div>
    <label for="oldPassInput">Текущий пароль</label>
    <input type="password" id="oldPassInput" placeholder="Текущий пароль">
    <label for="newPassInput">Новый пароль</label>
    <input type="password" id="newPassInput" placeholder="Новый пароль">
    <button class="btn-primary" id="changePassBtn">Сохранить пароль</button>
  </div>
</div>

<script>
(function(){
  // Адрес твоего backend. Поменяй, если он крутится на другом хосте/порту.
  const API_BASE = 'http://localhost:8080/api';

  let currentUser = null; // {login, score}
  let isRegisterMode = false;
  let currentTargetNumber = null;
  let attemptsUsed = 0;
  let gameOver = false;
  const MAX_ATTEMPTS = 3;

  // Общий помощник для запросов к backend.
  // Успешные ответы контроллеров — JSON (UserResponse), ошибки — обычный текст (ResponseEntity<String>).
  async function apiRequest(path, options){
    let res;
    try{
      res = await fetch(API_BASE + path, options);
    } catch(networkErr){
      throw new Error('Не удалось связаться с сервером. Проверь, что backend запущен.');
    }

    const contentType = res.headers.get('content-type') || '';
    let body = null;
    if(contentType.includes('application/json')){
      body = await res.json().catch(() => null);
    } else {
      const text = await res.text().catch(() => '');
      body = text || null;
    }

    if(!res.ok){
      const message = typeof body === 'string' ? body : 'Ошибка запроса.';
      throw new Error(message);
    }
    return body;
  }

  function showMsg(el, text){
    el.textContent = text;
    el.style.display = text ? 'block' : 'none';
  }
  function clearMsgs(...els){ els.forEach(e => showMsg(e, '')); }

  // ---------- AUTH SCREEN ----------
  const authError = document.getElementById('authError');
  const authSuccess = document.getElementById('authSuccess');
  const authSubtitle = document.getElementById('authSubtitle');
  const authMainBtn = document.getElementById('authMainBtn');
  const authSwitchBtn = document.getElementById('authSwitchBtn');
  const loginInput = document.getElementById('loginInput');
  const passInput = document.getElementById('passInput');

  function setAuthMode(register){
    isRegisterMode = register;
    clearMsgs(authError, authSuccess);
    if(register){
      authSubtitle.textContent = 'Создайте новый аккаунт';
      authMainBtn.textContent = 'Зарегистрироваться';
      authSwitchBtn.textContent = 'У меня уже есть аккаунт';
    } else {
      authSubtitle.textContent = 'Войдите в аккаунт, чтобы начать игру';
      authMainBtn.textContent = 'Войти';
      authSwitchBtn.textContent = 'Создать новый аккаунт';
    }
  }

  authSwitchBtn.addEventListener('click', () => setAuthMode(!isRegisterMode));

  authMainBtn.addEventListener('click', async () => {
    clearMsgs(authError, authSuccess);
    const login = loginInput.value.trim();
    const pass = passInput.value;

    if(!login || !pass){
      showMsg(authError, 'Заполните логин и пароль.');
      return;
    }
    if(login.length < 3){
      showMsg(authError, 'Логин должен быть не короче 3 символов.');
      return;
    }
    if(pass.length < 4){
      showMsg(authError, 'Пароль должен быть не короче 4 символов.');
      return;
    }

    authMainBtn.disabled = true;
    try{
      const endpoint = isRegisterMode ? '/register' : '/login';
      const userData = await apiRequest(endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ login: login, password: pass })
      });
      // Backend возвращает UserResponse: {login, score}
      currentUser = { login: userData.login, score: userData.score };
      enterApp();
    } catch(err){
      console.error(err);
      showMsg(authError, err.message || 'Ошибка соединения. Попробуйте ещё раз.');
    }
    authMainBtn.disabled = false;
  });

  // ---------- APP SHELL ----------
  const authScreen = document.getElementById('authScreen');
  const mainScreen = document.getElementById('mainScreen');
  const whoName = document.getElementById('whoName');
  const logoutBtn = document.getElementById('logoutBtn');

  function enterApp(){
    authScreen.style.display = 'none';
    mainScreen.style.display = 'block';
    whoName.textContent = currentUser.login;
    document.getElementById('myScore').textContent = currentUser.score;
    loginInput.value = '';
    passInput.value = '';
    startNewGame();
    loadLeaderboard();
    switchTab('game');
  }

  logoutBtn.addEventListener('click', () => {
    currentUser = null;
    mainScreen.style.display = 'none';
    authScreen.style.display = 'block';
    setAuthMode(false);
  });

  // ---------- TABS ----------
  const tabBtns = document.querySelectorAll('.tab-btn');
  function switchTab(name){
    tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-content').forEach(c => {
      c.classList.toggle('active', c.id === 'tab-' + name);
    });
    if(name === 'leaderboard') loadLeaderboard();
  }
  tabBtns.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  // ---------- GAME ----------
  const gameLastGuess = document.getElementById('gameLastGuess');
  const attemptsLeftEl = document.getElementById('attemptsLeft');
  const guessHistoryEl = document.getElementById('guessHistory');
  const gameFeedback = document.getElementById('gameFeedback');
  const guessInput = document.getElementById('guessInput');
  const guessBtn = document.getElementById('guessBtn');
  const newGameBtn = document.getElementById('newGameBtn');
  const myScoreEl = document.getElementById('myScore');

  function startNewGame(){
    currentTargetNumber = Math.floor(Math.random() * 10) + 1;
    attemptsUsed = 0;
    gameOver = false;
    gameLastGuess.textContent = '—';
    gameFeedback.textContent = '';
    gameFeedback.className = 'feedback';
    guessHistoryEl.innerHTML = '';
    attemptsLeftEl.textContent = 'Осталось попыток: ' + MAX_ATTEMPTS;
    guessInput.value = '';
    guessInput.disabled = false;
    guessBtn.disabled = false;
    newGameBtn.style.display = 'none';
  }

  newGameBtn.addEventListener('click', startNewGame);

  async function submitGuess(){
    if(gameOver) return;
    const raw = guessInput.value.trim();
    const num = parseInt(raw, 10);

    if(!raw || isNaN(num) || num < 1 || num > 10){
      gameFeedback.textContent = 'Введите целое число от 1 до 10.';
      gameFeedback.className = 'feedback hint-up';
      return;
    }

    attemptsUsed++;
    gameLastGuess.textContent = num;

    const span = document.createElement('span');
    span.textContent = num;
    guessHistoryEl.appendChild(span);

    if(num === currentTargetNumber){
      gameOver = true;
      gameFeedback.textContent = 'Верно! Загаданное число было ' + currentTargetNumber + '.';
      gameFeedback.className = 'feedback win';
      attemptsLeftEl.textContent = 'Угадано за ' + attemptsUsed + ' попытку(и)';
      guessInput.disabled = true;
      guessBtn.disabled = true;
      newGameBtn.style.display = 'block';
      await awardPoint();
      return;
    }

    const remaining = MAX_ATTEMPTS - attemptsUsed;
    if(remaining <= 0){
      gameOver = true;
      gameFeedback.textContent = 'Попытки закончились. Было загадано число ' + currentTargetNumber + '.';
      gameFeedback.className = 'feedback lose';
      attemptsLeftEl.textContent = 'Осталось попыток: 0';
      guessInput.disabled = true;
      guessBtn.disabled = true;
      newGameBtn.style.display = 'block';
      return;
    }

    if(num < currentTargetNumber){
      gameFeedback.textContent = 'Загаданное число больше.';
      gameFeedback.className = 'feedback hint-up';
    } else {
      gameFeedback.textContent = 'Загаданное число меньше.';
      gameFeedback.className = 'feedback hint-down';
    }
    attemptsLeftEl.textContent = 'Осталось попыток: ' + remaining;
    guessInput.value = '';
    guessInput.focus();
  }

  guessBtn.addEventListener('click', submitGuess);
  guessInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitGuess(); });

  async function awardPoint(){
    try{
      const updated = await apiRequest('/score?login=' + encodeURIComponent(currentUser.login), {
        method: 'POST'
      });
      currentUser.score = updated.score;
      myScoreEl.textContent = currentUser.score;
    } catch(err){
      console.error('Не удалось сохранить очко', err);
      gameFeedback.textContent += ' (очко не сохранилось: ' + err.message + ')';
    }
  }

  // ---------- LEADERBOARD ----------
  const leaderboardList = document.getElementById('leaderboardList');

  async function loadLeaderboard(){
    leaderboardList.innerHTML = '<div class="loading-note">Загрузка…</div>';
    try{
      // Backend уже возвращает отсортированный список (UserResponse[])
      const raw = await apiRequest('/leaderboard', { method: 'GET' });
      const users = (raw || []).map(u => ({ login: u.login, score: u.score || 0 }));

      if(users.length === 0){
        leaderboardList.innerHTML = '<div class="empty-note">Пока никто не играл.</div>';
        return;
      }

      leaderboardList.innerHTML = '';
      users.forEach((u, i) => {
        const row = document.createElement('div');
        row.className = 'lb-row';
        const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
        const isMe = currentUser && u.login.toLowerCase() === currentUser.login.toLowerCase();
        row.innerHTML =
          '<div class="lb-rank ' + rankClass + '">' + (i+1) + '</div>' +
          '<div class="lb-name' + (isMe ? ' me' : '') + '">' + escapeHtml(u.login) + (isMe ? ' (ты)' : '') + '</div>' +
          '<div class="lb-score">' + u.score + '</div>';
        leaderboardList.appendChild(row);
      });
    } catch(err){
      console.error(err);
      leaderboardList.innerHTML = '<div class="empty-note">Не удалось загрузить таблицу лидеров: ' + escapeHtml(err.message) + '</div>';
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- PROFILE ----------
  const newLoginInput = document.getElementById('newLoginInput');
  const changeLoginBtn = document.getElementById('changeLoginBtn');
  const profileLoginError = document.getElementById('profileLoginError');
  const profileLoginSuccess = document.getElementById('profileLoginSuccess');

  changeLoginBtn.addEventListener('click', async () => {
    clearMsgs(profileLoginError, profileLoginSuccess);
    const newLogin = newLoginInput.value.trim();
    if(!newLogin || newLogin.length < 3){
      showMsg(profileLoginError, 'Логин должен быть не короче 3 символов.');
      return;
    }
    if(newLogin.toLowerCase() === currentUser.login.toLowerCase()){
      showMsg(profileLoginError, 'Это уже твой текущий логин.');
      return;
    }
    changeLoginBtn.disabled = true;
    try{
      const query = '?currentLogin=' + encodeURIComponent(currentUser.login);
      await apiRequest('/profile/login' + query, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ newLogin: newLogin })
      });
      currentUser.login = newLogin;
      whoName.textContent = currentUser.login;
      newLoginInput.value = '';
      showMsg(profileLoginSuccess, 'Логин обновлён.');
      loadLeaderboard();
    } catch(err){
      console.error(err);
      showMsg(profileLoginError, err.message || 'Не удалось изменить логин. Попробуйте ещё раз.');
    }
    changeLoginBtn.disabled = false;
  });

  const oldPassInput = document.getElementById('oldPassInput');
  const newPassInput = document.getElementById('newPassInput');
  const changePassBtn = document.getElementById('changePassBtn');
  const profilePassError = document.getElementById('profilePassError');
  const profilePassSuccess = document.getElementById('profilePassSuccess');

  changePassBtn.addEventListener('click', async () => {
    clearMsgs(profilePassError, profilePassSuccess);
    const oldPass = oldPassInput.value;
    const newPass = newPassInput.value;
    if(!oldPass || !newPass){
      showMsg(profilePassError, 'Заполните оба поля.');
      return;
    }
    if(newPass.length < 4){
      showMsg(profilePassError, 'Новый пароль должен быть не короче 4 символов.');
      return;
    }
    changePassBtn.disabled = true;
    try{
      // Сверка старого пароля происходит на сервере — фронт его не хранит и не проверяет сам.
      const query = '?login=' + encodeURIComponent(currentUser.login);
      await apiRequest('/profile/password' + query, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ oldPassword: oldPass, newPassword: newPass })
      });
      oldPassInput.value = '';
      newPassInput.value = '';
      showMsg(profilePassSuccess, 'Пароль обновлён.');
    } catch(err){
      console.error(err);
      showMsg(profilePassError, err.message || 'Не удалось изменить пароль. Попробуйте ещё раз.');
    }
    changePassBtn.disabled = false;
  });

})();
</script>
</body>
</html>
